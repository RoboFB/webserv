http {
    server {
        listen 5001;

        location / {
            root ./www;
            index index.html;
            limit_except GET;
			error_page 404 /errors/404.html;
        }

        location /assets {
            root ./www/assets;
			autoindex on;
            limit_except GET;
        }

		location /upload {
            root ./www/uploads;
            limit_except GET POST DELETE;
            # Keep the listing available when an upload is named index.html.
            index .;
			autoindex on;
			upload_store .;
			client_max_body_size 10M;
        }

        location /limit-demo {
            root ./www/uploads;
            limit_except POST;
            upload_store .;
            client_max_body_size 1K;
        }

		location /cgi {
			root ./www/cgi;
			index index.php;
			cgi .py /usr/bin/python3;
			cgi .php /usr/bin/php-cgi;
			limit_except GET POST;
		}

		location /redirect {
			return 301 /;
		}
    }

	server {
        listen 5002;

        location / {
            root ./alt;
            index index.html;
            limit_except GET;
			error_page 404 /errors/404.html;
        }
    }
}
