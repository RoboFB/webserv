http {
    server {
        listen 5001;

        location / {
            root ./www;
            index index.html;
            limit_except GET;
			error_page 404 /errors/404.html;
        }

        location /assets {
            root ./www/assets;
			autoindex on;
            limit_except GET;
        }

		location /upload {
            root ./www/uploads;
            limit_except GET POST DELETE;
			upload_store .;
			client_max_body_size 10M;
        }

		location /cgi {
			root ./www/cgi;
			index index.py;
			cgi .py /usr/bin/python3;
			limit_except GET POST;
		}

		location /redirect {
			return 301 /;
		}
    }
}