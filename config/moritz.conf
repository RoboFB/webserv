http {
    server {
        listen 5001;

        location / {
            root ./www;
            index index.html;
            limit_except GET;
        }

        location /assets {
            root ./www/assets;
            limit_except GET;
        }

		location /upload {
            root ./www/uploads;
            limit_except GET POST DELETE;
			client_max_body_size 10M;
        }
    }
}